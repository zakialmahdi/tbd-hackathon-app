name: Deploy specific folder to GitHub Pages

on:
  push:
    branches: [ "main" ] # or "master"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload specific artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Point this strictly to your target folder
          path: 'tbd-hackathon-app/Website'

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
