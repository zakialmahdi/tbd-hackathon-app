<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <link rel="stylesheet" href="styles.css">
  <title>Admin sign in | VertivEra</title>
</head>
<body data-auth-mode="signin">
  <div id="fileWarn" style="display:none;position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:99999;background:#fef3c7;border:1px solid #f59e0b;color:#92400e;padding:16px 20px;border-radius:16px;font-size:14px;line-height:1.5;max-width:480px;box-shadow:0 8px 30px rgba(0,0,0,0.15);">
    <strong>⚠️ Running directly from disk (file://)</strong><br>
    Modern browsers block ES modules on <code>file://</code>.<br>
    Please start the server by running <code>npm start</code> or double-clicking <strong>run.bat</strong>, then open <a href="http://localhost:3000" style="color:#b45309;font-weight:700;">http://localhost:3000</a>.
  </div>
  <script>
    if (location.protocol === 'file:') document.getElementById('fileWarn').style.display = 'block';
  </script>
  <div id="login"><section class="card">
    <div class="auth-brand"><div class="auth-mark"><img src="vertivera_app_icon.png" alt=""></div><div><p class="auth-eyebrow">VertivEra</p><h2>Admin sign in</h2><p class="sub">Admin console access</p></div></div>
    <form id="authForm">
    <label for="em">Email</label><input id="em" type="email" autocomplete="username" required>
    <label for="pw">Password</label><div class="secret-field"><input id="pw" type="password" autocomplete="current-password" required><button class="reveal-btn" type="button" data-reveal="pw" aria-controls="pw" aria-label="Show password">Show</button></div>
    <div class="acts"><button class="btn" id="go" type="submit">Sign in</button><button class="btn ghost" id="reset" type="button">Reset password</button></div>
    </form>
    <div class="auth-divider" aria-hidden="true">or</div>
    <button class="provider-btn" id="googleAuth" type="button"><svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.74 7.18l7.72 5.99c4.51-4.16 7.06-10.28 7.06-17.64z"/><path fill="#FBBC05" d="M10.53 28.59A14.4 14.4 0 0 1 9.75 24c0-1.59.27-3.13.76-4.59l-7.98-6.19A23.9 23.9 0 0 0 0 24c0 3.87.93 7.53 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.91-5.81l-7.72-5.99c-2.14 1.44-4.89 2.3-8.19 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg><span>Continue with Google</span></button>
    <p class="note auth-switch">Need an admin account? <a class="auth-link" href="register.html">Register</a></p>
    <p class="note auth-error" id="lerr" role="status" aria-live="polite"></p>
  </section></div>
  <script type="module" src="auth.js"></script>
</body>
</html>
