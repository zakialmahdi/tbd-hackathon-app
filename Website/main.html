<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
  <link rel="stylesheet" href="styles.css">
  <title>VertivEra Admin</title>
</head>
<body>
  <div id="fileWarn" style="display:none;position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:99999;background:#fef3c7;border:1px solid #f59e0b;color:#92400e;padding:16px 20px;border-radius:16px;font-size:14px;line-height:1.5;max-width:480px;box-shadow:0 8px 30px rgba(0,0,0,0.15);">
    <strong>⚠️ Running directly from disk (file://)</strong><br>
    Modern browsers block ES modules on <code>file://</code>.<br>
    Please start the server by running <code>npm start</code> or double-clicking <strong>run.bat</strong>, then open <a href="http://localhost:3000" style="color:#b45309;font-weight:700;">http://localhost:3000</a>.
  </div>
  <script>
    if (location.protocol === 'file:') document.getElementById('fileWarn').style.display = 'block';
  </script>
  <nav id="nav">
    <h1>VertivEra<small>Admin console</small></h1>
    <button data-p="home" class="on">🏠 Overview</button>
    <button data-p="reports">📍 Reports</button>
    <button data-p="bins">🗺️ Bin Map</button>
    <button data-p="market">🛍️ ReMarket</button>
    <button data-p="settings">⚙️ Settings</button>
    <div id="who"></div>
  </nav>
  <main id="main"></main>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
